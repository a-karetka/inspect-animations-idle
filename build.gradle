// Minecraft version template: Stonecutter evaluates this file once per declared
// version (26.1, 26.2, 26.3 - see settings.gradle), rootProject -> versions/<mc>/.
// Concrete dependency versions come from stonecutter.properties.toml.

plugins {
	// Plain Loom 1.18: Minecraft 26.x ships unobfuscated, so there is no remapping
	// and no refmap; the same plugin version serves every declared node. If this
	// ever diverges per Minecraft version, switch to the loom-back-compat plugin.
	id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

// Release jars are named {mod.id}-{mod.version}+{mc version}.jar, mirroring how
// Inspect Animations itself names per-version artifacts.
version = "${property('mod.version')}+${sc.current.version}"
base.archivesName = property('mod.id') as String

repositories {
	maven { url 'https://maven.terraformersmc.com/releases/' }
	// YACL (the config screen API) resolves from Modrinth's maven below, so neither CI
	// nor a fresh checkout needs any pre-downloaded jar for `./gradlew buildAll` to pass.
	maven { url 'https://api.modrinth.com/maven' }
	// Uncomment for dev runs with a locally downloaded Inspect Animations jar:
	// flatDir { dirs '../../libs' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"inspect-animations-idle" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Note: the dev run directory stays per-node (versions/<mc>/run, the Loom default):
	// sharing it across nodes makes Gradle reject runClient with implicit-dependency
	// validation errors (every downloadAssets task output lands in one folder).
}

dependencies {
	minecraft "com.mojang:minecraft:${sc.current.version}"
	implementation "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}"

	// No Fabric API: the mod used exactly one of its entrypoints (END_CLIENT_TICK), now
	// served by the vanilla tick-tail hook in MinecraftMixin. Inspect Animations - this
	// mod's hard dependency - pulls Fabric API into every real install anyway, so nothing
	// changes for users; this only trims one per-version dependency from the build.

	// ModMenu (compile-only; loaded at runtime only when Mod Menu itself is installed)
	compileOnly "com.terraformersmc:modmenu:${property('deps.modmenu')}"

	// YetAnotherConfigLib (compile-only; never bundled here) - the config screen is built
	// on its API for a matching look with Inspect Animations. Declared as a hard depends
	// in fabric.mod.json; Inspect Animations (hard depends) requires it too. Resolved
	// from Modrinth's maven (repository declared above), not from a local file.
	// Modrinth maven artifact id equals the Modrinth project slug ("yacl"), version
	// equals the Modrinth version number.
	compileOnly "maven.modrinth:yacl:${property('deps.yacl')}"

	// Inspect Animations is a hard dependency (fabric.mod.json depends), so dev runs need it too.
	// Drop its jar for the target version (renamed, e.g. "inspectanimations-0.2.5.jar") into
	// the root "libs" folder, then uncomment the line below and the flatDir repository above.
	// Compiling the release never needs it (upstream is used via a reflection probe), so
	// both lines MUST stay commented out - an uncommented line kills the CI build, which
	// has no libs/ folder (it broke the v1.1.0 tag once).
	// localRuntime "libs:inspectanimations:0.2.5"
}

processResources {
	// fabric.mod.json placeholders: ${version} is the clean mod.version; ${minecraft}
	// is this node's declared compatibility range (e.g. ">=26.3 <26.4").
	// project.property() instead of bare property(): inside a task scope the latter
	// would bind to the task, not to the project's Stonecutter-backed properties.
	def props = [
		version  : project.property('mod.version'),
		minecraft: project.property('mod.mc_compat'),
	]
	inputs.properties(props)
	filesMatching('fabric.mod.json') {
		expand(props)
	}
	// The generated per-animation tags (see tools/tags/generate.py) are kept outside
	// the shared src/ because their content is per Minecraft version; the matching
	// set is placed at the datapack path Inspect Animations reads our tags from.
	into('data/inspect-animations-idle/tags/item') {
		from rootProject.file("src/generated/tags/${sc.current.version}")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25  // every supported 26.x node runs on Java 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Copies this node's release artifacts to build/libs/<mod version>, one folder
// holding the jars of every supported version together. The root `buildAll`
// task (registered in stonecutter.gradle) aggregates this across the nodes.
tasks.register('buildAndCollect', Copy) {
	group = 'build'
	description = 'Builds the mod jar for this Minecraft version and copies it into the release folder.'
	inputs.property('mod.version', project.property('mod.version'))
	from tasks.named('jar').flatMap { it.archiveFile }
	// sources jar is optional, kept out of game installs (see AGENTS.md)
	from tasks.named('sourcesJar').flatMap { it.archiveFile }
	into rootProject.layout.buildDirectory.dir("libs/${project.property('mod.version')}")
}
