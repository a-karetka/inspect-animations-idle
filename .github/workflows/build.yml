# Builds the mod on pull requests, and on version tags (v*) builds and publishes
# the per-version jars as a GitHub Release. Version numbering: `mod.version` in
# stonecutter.properties.toml must match the pushed tag (without the "v" prefix)
# - the workflow enforces this.
name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    # Docs and editorial files cannot change build results; skipping them keeps
    # the (multi-version) build queue short.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Superseded builds of the same ref (forced pushes, re-tagged releases) are
# cancelled instead of racing each other on the release upload step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # The dev-only localRuntime/flatDir lines live commented out in build.gradle
      # (this checkout has no libs/ folder - it broke the v1.1.0 tag once).
      - name: Check dev-only libs lines stay commented
        run: |
          if git grep -nE '^[[:space:]]*(localRuntime|compileOnly)[[:space:]]+"libs:' build.gradle; then
            echo "build.gradle must not reference 'libs:' outside of comments - CI has no libs/ folder"
            exit 1
          fi

      # Release tags must agree with the mod version in stonecutter.properties.toml,
      # otherwise the release would carry jars versioned differently from its tag.
      - name: Verify tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's/^mod.version *= *"\(.*\)"/\1/p' stonecutter.properties.toml)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag 'v$TAG' does not match 'mod.version = \"$VERSION\"' in stonecutter.properties.toml"
            echo "Tip: bump the version, or move the tag, then push it again."
            exit 1
          fi

      - name: Build all versions
        run: ./gradlew buildAll --no-configuration-cache

      # The committed per-version tag files must equal a fresh regeneration for
      # every declared node (see tools/tags/generate.py). Runs after the build so
      # the vanilla jars can come from the Loom cache that buildAll just populated
      # (path exists only locally/ cached runs; on a cold runner the script's own
      # Mojang cache with a download fallback serves instead).
      - name: Verify generated item tags
        run: |
          for mc in 26.1.2 26.2 26.3; do
            python3 tools/tags/generate.py --check --mc "$mc"
          done

      # PR runs: expose the built jars as downloadable artifacts for review.
      # Sources jars are dev-only and are excluded from every upload (see AGENTS.md).
      - name: Upload jars (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/**/*.jar
            !build/libs/**/*-sources.jar
          if-no-files-found: error

      # Release body: the matching CHANGELOG.md section, so the release page does
      # not end up (as it did for 1.1.0) with jars but a blank description.
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$TAG]" '
            /^## \[/ {
              if (capturing) { exit }
              capturing = (substr($0, 1, length(hdr)) == hdr)
              next
            }
            capturing
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "CHANGELOG.md has no '## [$TAG]' section - add and date it before tagging."
            exit 1
          fi
          cat release_body.md

      # Tag runs: attach the per-version jars to the GitHub Release for this tag.
      # Negative globs are NOT supported by action-gh-release (only actions/upload-artifact
      # honours them), so dev-only -sources jars are filtered by copying the release jars
      # into a staging folder first - the v1.2.0 tag taught this the hard way: the previous
      # '!…-sources.jar' pattern published the sources jars anyway.
      - name: Stage release jars
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build/release-jars
          find build/libs -type f -name '*.jar' ! -name '*-sources.jar' \
            -exec cp {} build/release-jars/ \;
          find build/release-jars -name '*-sources.jar' -print | grep . && exit 1 || true
          ls build/release-jars

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release-jars/*.jar
          body_path: release_body.md
          generate_release_notes: true

      # Loud post-check: the release must carry only game-install jars. The upload step
      # above does not fail on an unexpected extra file, so verify the asset list itself.
      - name: Assert release has no dev-only assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names="$(gh api "repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[].name')"
          echo "$names"
          if echo "$names" | grep -- '-sources'; then
            echo "dev-only -sources jars must not be published to releases"
            exit 1
          fi
