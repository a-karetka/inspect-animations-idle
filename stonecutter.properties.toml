# Centralized Stonecutter properties: shared values first, one section per
# supported Minecraft version below. Consumed by build.gradle through
# property()/sc.properties for both the compile classpath and fabric.mod.json.
# Per-version dependency boxes exist on Modrinth/FabricMC - add a section
# (and a settings.gradle entry) together when a new Minecraft version is opened.

mod.id = "inspect-animations-idle"
mod.group = "com.github.akaretka"
mod.version = "1.2.0"

deps.fabric_loader = "0.19.5"

# 26.1.2 is the only 26.1-line release upstream's jars actually load on (their
# manifests pin 26.1.2; 26.1/26.1.1 come only from Modrinth listing metadata).
# 26.x is unobfuscated, so one shared codebase (no refmaps) serves every node.
["26.1.2"]
mod.mc_compat = ">=26.1 <26.2"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

deps.modmenu = "18.0.2"
deps.yacl = "3.9.7+26.1-fabric"

["26.2"]
mod.mc_compat = ">=26.2 <26.3"
mod.mc_releases = ["26.2"]

deps.modmenu = "20.0.3"
deps.yacl = "3.9.7+26.2-fabric"

["26.3"]
mod.mc_compat = ">=26.3 <26.4"
mod.mc_releases = ["26.3"]

deps.modmenu = "21.0.0"
deps.yacl = "3.9.7+26.3-fabric"
