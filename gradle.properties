# Gradle options only. The mod id, version and every per-version dependency live
# in stonecutter.properties.toml (this file is evaluated once per Minecraft
# version, so it must stay version-agnostic).
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# maven.kikugie.dev (the Stonecutter plugin host) is occasionally slow; Gradle's
# default 30s socket timeout drops the download mid-body on the first run.
systemProp.org.gradle.internal.http.socket.timeout=120000
systemProp.org.gradle.internal.http.connection.timeout=60000
